name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for OpenCV (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install packages
        run: python -m pip install -r requirements.txt
      - name: Every script compiles
        run: python -m compileall -q bball run.py download_models.py timeline_sheets.py s0_proxy.py s1_detect.py s2_calibrate.py s3_players.py s4_serves.py s5_score.py s6_rallies.py s7_movement.py s8_pose.py s9_pickups.py s10_report.py s10_coach.py s10_pdf.py s11_video.py
      - name: Unit tests
        run: python -m unittest discover tests -v
      - name: Command line
        run: python run.py --help
